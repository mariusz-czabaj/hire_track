name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx astro sync
      - run: npm run typecheck
      - run: npm run test
      - run: npm run lint
      - run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start
      - name: Export local Supabase connection info
        run: supabase status -o env >> "$GITHUB_ENV"
      - name: Map local Supabase env to app vars
        run: |
          echo "SUPABASE_URL=${API_URL//\"/}" >> "$GITHUB_ENV"
          echo "SUPABASE_KEY=${PUBLISHABLE_KEY//\"/}" >> "$GITHUB_ENV"
      - name: Regenerate database types and fail on drift
        run: |
          npm run db:types
          git diff --exit-code src/db/database.types.ts
      - name: Run HTTP integration tests
        run: |
          npm run dev &
          DEV_PID=$!
          # Poll an actual API route, not just "/" -- Astro dev's Vite
          # optimizer lazily reloads dependency bundles (e.g. @supabase/ssr)
          # on the first request that touches a given route's module graph.
          # The root page can respond fine while an API route is still mid
          # reload, which raced the first integration test in CI once.
          # No -f here: /api/security-groups is auth-gated and correctly
          # returns 401 when unauthenticated -- any HTTP response (not a
          # connection error) is what "ready" means for this probe.
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:4321/api/security-groups && break
            sleep 2
          done
          # Same lazy-module-graph hazard applies per route, not just once --
          # the candidates routes are new in this slice and load a distinct
          # dependency graph (RPC error mapping, zod schemas) that the
          # security-groups probe above never touches. Poll one of them too.
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:4321/api/recruitments/1/candidates/1 && break
            sleep 2
          done
          # The authorization contract suite
          # (src/pages/api/authorization.integration.test.ts) is the first
          # integration coverage to touch the board route's module graph
          # (getKanbanBoard + resolveKanbanStages) -- a distinct Vite
          # dependency graph from the two probed above. Poll it too, or
          # this suite's first test races the optimizer exactly as the
          # prior two flakes did.
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:4321/api/recruitments/1/board && break
            sleep 2
          done
          # The dev server responding isn't enough: right after `supabase
          # start`, the GoTrue and PostgREST containers' clocks can be
          # briefly out of sync, so PostgREST rejects a freshly-issued JWT
          # with "JWT issued at future" (PGRST303) on the first authenticated
          # request -- this raced the integration suite's very first test
          # twice in CI. Do a real sign-in + authenticated GET here and keep
          # retrying until it actually succeeds, so that clock-skew window
          # resolves before the test suite runs instead of inside it.
          for i in $(seq 1 30); do
            rm -f /tmp/ci-cookies.txt
            curl -s -o /dev/null -c /tmp/ci-cookies.txt \
              -H "Origin: http://localhost:4321" \
              --data-urlencode "email=hr.test@example.com" \
              --data-urlencode "password=password123" \
              http://localhost:4321/api/auth/signin
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -b /tmp/ci-cookies.txt \
              http://localhost:4321/api/recruitments)
            [ "$STATUS" = "200" ] && break
            sleep 2
          done
          npm run test:integration
          TEST_EXIT=$?
          kill "$DEV_PID" 2>/dev/null || true
          pkill -f "astro dev" 2>/dev/null || true
          exit $TEST_EXIT
      - name: Reset local database to pristine seed
        # The HTTP integration tests above create real recruitments (there's
        # no DELETE policy on `recruitments` by design -- see F-01's plan),
        # so the DB must go back to a clean seed before the E2E suite runs
        # against the same local Supabase instance.
        run: npx supabase db reset --local
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
