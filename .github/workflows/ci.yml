name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx astro sync
      - run: npm run typecheck
      - run: npm run test
      - run: npm run lint
      - run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start
      - name: Export local Supabase connection info
        run: supabase status -o env >> "$GITHUB_ENV"
      - name: Map local Supabase env to app vars
        run: |
          echo "SUPABASE_URL=${API_URL//\"/}" >> "$GITHUB_ENV"
          echo "SUPABASE_KEY=${PUBLISHABLE_KEY//\"/}" >> "$GITHUB_ENV"
      - name: Regenerate database types and fail on drift
        run: |
          npm run db:types
          git diff --exit-code src/db/database.types.ts
      - name: Run HTTP integration tests
        run: |
          npm run dev &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4321/ -o /dev/null && break
            sleep 2
          done
          npm run test:integration
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
